{{define "navbar"}}
<header class="site-header">
  <div class="site-header__inner">
    <div class="site-header__brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <a href="/" class="site-header__title">{{.Site.Title}}</a>
      <span class="site-header__tagline">{{truncate .Site.Description 60}}</span>
    </div>
    <nav class="site-header__nav">
      <ul class="nav-links">
        {{range .Site.Menus}}
        {{if eq .Hide false}}
        <li>
          <a href="/{{.URL | urlize}}" class="nav-link">{{.Name}}</a>
        </li>
        {{end}}
        {{end}}
      </ul>
      <div class="site-search" id="site-search">
        <button class="site-search__toggle" id="search-toggle" type="button" aria-label="Search posts" aria-controls="site-search-panel" aria-expanded="false">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-4-4"></path>
          </svg>
        </button>
        <div class="site-search__panel" id="site-search-panel">
          <label class="sr-only" for="search-input">Search posts</label>
          <div class="site-search__field">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="m20 20-4-4"></path>
            </svg>
            <input id="search-input" type="search" placeholder="Search posts..." autocomplete="off" spellcheck="false" />
          </div>
          <ul id="search-results" aria-label="Search results"></ul>
          <p class="site-search__hint">Type at least 2 characters to search.</p>
        </div>
      </div>
    </nav>
  </div>
</header>
<script>
  (function initHeaderScrollBehavior() {
    const header = document.querySelector('.site-header');
    if (!header) return;

    let lastY = window.scrollY || 0;
    const threshold = 6;

    function handleScroll() {
      const y = window.scrollY || 0;
      if (y < 56) {
        header.classList.remove('site-header--hidden');
        lastY = y;
        return;
      }

      if (document.body.classList.contains('sidepanel-open') ||
          header.querySelector('.site-search--open')) {
        header.classList.remove('site-header--hidden');
        lastY = y;
        return;
      }

      if (y > lastY + threshold) {
        header.classList.add('site-header--hidden');
      } else if (y < lastY - threshold) {
        header.classList.remove('site-header--hidden');
      }
      lastY = y;
    }

    window.addEventListener('scroll', handleScroll, { passive: true });
  })();
</script>
{{end}}
