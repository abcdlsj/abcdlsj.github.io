{{define "posts"}}
<!DOCTYPE html>
<html lang="en">
  <head>
    {{template "head" dict "Site" .Site "IsPost" false}}
  </head>
  <body>
    <div class="app">
      {{template "navbar" .}}
      <main class="container">
        <section class="home-section">
          <div class="section-header">
            <h2 class="section-title">All Posts · {{len .Posts}}</h2>
          </div>
          <div class="post-list">
            {{range .Posts}}
            <article class="post-item {{if eq .Cover ""}}post-item--no-cover{{end}}">
              <div class="post-item__main">
                <a href="/posts/{{.Uname | urlize}}.html" class="post-item__title">{{.Meta.Title}}</a>
                {{if .Excerpt}}
                <p class="post-item__excerpt">{{.Excerpt}}</p>
                {{end}}
                <time class="post-item__date" datetime="{{.Meta.Date}}">{{.Meta.Date | day}}</time>
              </div>
              {{if ne .Cover ""}}
              <a class="post-item__thumb" href="/posts/{{.Uname | urlize}}.html" aria-label="{{.Meta.Title}}">
                <img src="{{.Cover}}" alt="{{.Meta.Title}}" loading="lazy" />
              </a>
              {{end}}
            </article>
            {{end}}
          </div>
        </section>
      </main>
      {{template "footer" .}}
    </div>
  </body>
</html>
{{end}}
